# Thunderstore upload settings, in the format of Thunderstore's CLI (tcli), for the Publish workflow in .publishing.
# Version, description, website and dependencies are NOT here: they live in the .csproj and go into the
# generated manifest.json inside the Release zip, which is what gets uploaded.
#
# Every build checks this file (docs/DEVELOPMENT.md, section 6): namespace must equal ThunderstoreTeam,
# name must equal AssemblyName, and the categories must be filled in, never "undefined".
# Category slugs: https://thunderstore.io/api/experimental/community/valheim/category/
# Hexium's categories are in hexium.json. The Publish workflow sets both stores' categories on every publish.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quandru"
name = "QuanPieces"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["ai-generated", "building", "client-side", "crafting", "deep-north-update", "mods", "server-side"]
